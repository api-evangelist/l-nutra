- id: google-pay-ucp
  name: Google Pay UCP payment handler
  conforms: true
  evidence: >-
    /.well-known/ucp declares payment_handlers["com.google.pay"] version 2026-01-11 with
    merchant_info.merchant_name "Prolon Life" and merchant_origin prolonlife.com.
- id: asyncapi
  name: AsyncAPI
  conforms: false
