tools:
- name: search_catalog
  category: catalog
  description: Search for products from the online store using natural language queries or specific filters.
- name: lookup_catalog
  category: catalog
  description: Look up multiple products or variants by identifier in a single request.
- name: get_product
  category: catalog
  description: Retrieve complete product detail by identifier, with variants, exact pricing and real-time availability.
- name: create_cart
  category: cart
  description: Creates a new cart.
- name: get_cart
  category: cart
  description: Get the cart contents.
- name: update_cart
  category: cart
  description: Perform updates to a cart.
- name: cancel_cart
  category: cart
  description: Cancels a cart.
- name: create_checkout
  category: checkout
  description: Creates a checkout and returns line items, totals, discounts and taxes.
- name: get_checkout
  category: checkout
  description: Returns details about the checkout, including line items, totals, discounts and taxes.
- name: update_checkout
  category: checkout
  description: Updates a checkout — shipping address, shipping method, buyer details.
- name: complete_checkout
  category: checkout
  description: >-
    Completes a checkout and returns the order ID and Thank You Page URL. Requires a caller-supplied
    meta.idempotency-key (declared required in the tool's own input schema).
- name: cancel_checkout
  category: checkout
  description: Cancels a checkout.
- name: get_order
  category: order
  description: Get the details of an order.
storefront_mcp_tools:
- name: search_catalog
  hosts: [prolonlife.com]
- name: get_cart
  hosts: [prolonlife.com]
- name: update_cart
  hosts: [prolonlife.com]
- name: get_product_details
  hosts: [prolonlife.com]
- name: search_shop_policies_and_faqs
  hosts: [prolonlife.com, l-nutrahealth.com, l-nutraprofessional.com]
constraints:
- >-
  Human approval is mandatory before payment. prolonlife.com/robots.txt and /llms.txt both state that
  agents must not complete checkout, payment or order placement automatically without an explicit,
  contemporaneous human approval step.
- The MCP endpoint is rate-limited per IP; the published guidance is to back off on HTTP 429.
- Pass context.address_country and context.currency for accurate pricing and availability.
