generated: '2026-08-23'
method: probed
status: published
source: https://prolonlife.com/llms.txt
description: >-
  L-Nutra operates no developer platform, but all three of its storefronts expose live, anonymous,
  remote MCP endpoints. Each storefront serves a Universal Commerce Protocol (UCP) 2026-04-08
  discovery profile at /.well-known/ucp naming an MCP transport endpoint at /api/ucp/mcp, and a
  second Shopify Storefront MCP endpoint at /api/mcp. Every endpoint below was POSTed a real
  tools/list JSON-RPC request on 2026-08-23 and returned HTTP 200 with a populated tool set and
  full JSON Schema 2020-12 input schemas — no authentication, no OAuth challenge. The tool lists
  are saved verbatim alongside this manifest.
ownership: >-
  These endpoints are Shopify platform infrastructure served under L-Nutra's own domains and scoped
  to L-Nutra's own shops. Each /.well-known/ucp names the merchant shop that backs it —
  prolon-fmd-2020.myshopify.com, l-nutra-health-2022.myshopify.com and prolon-pro.myshopify.com —
  and the llms.txt served at each host names the store by its L-Nutra brand, so the catalog, cart,
  checkout and order data behind every tool is L-Nutra's. The protocol implementation is Shopify's;
  the commercial surface it exposes is L-Nutra's, the same relationship as a WordPress /wp-json
  surface on a publisher's own domain.
deployment:
  mode: remote
  endpoint: https://prolonlife.com/api/ucp/mcp
  auth: none
  verified: probed
  checked: '2026-08-23'
  note: >-
    Anonymous over HTTPS. No install step, no package, no stdio variant published. Payment
    completion is gated on contemporaneous human approval by store policy, not by a credential.
servers:
- name: prolon-life-ucp
  host: prolonlife.com
  endpoint: https://prolonlife.com/api/ucp/mcp
  protocol: MCP over HTTP (UCP transport)
  ucp_version: '2026-04-08'
  ucp_supported_versions: ['2026-04-08', '2026-01-23']
  backing_shop: prolon-fmd-2020.myshopify.com
