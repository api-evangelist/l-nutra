aid: l-nutra
name: L-Nutra
description: >-
  L-Nutra, Inc. is a Los Angeles based nutri-technology company founded on the fasting-mimicking
  diet (FMD) research of Dr. Valter Longo at the USC Longevity Institute. It develops and sells
  clinically studied nutrition programs — the ProLon 5-Day Fasting Mimicking Diet, Fast Bar and
  related longevity nutrition products — direct to consumers, to healthcare providers, and through
  an employer and health-plan channel. L-Nutra is not a developer-platform company and publishes no
  developer portal, OpenAPI description or API reference of its own. Its machine-readable surface is
  the agentic-commerce layer of its three Shopify storefronts (prolonlife.com, l-nutrahealth.com and
  l-nutraprofessional.com): each serves an llms.txt / agents.md agent instruction document, a
  Universal Commerce Protocol (UCP) discovery profile at /.well-known/ucp, an anonymous MCP endpoint
  at /api/ucp/mcp exposing thirteen catalog, cart, checkout and order tools, a Shopify Storefront MCP
  endpoint at /api/mcp, and Shopify customer-account OpenID Connect discovery documents.
