apis:
- name: ProLon Life Agentic Commerce (UCP/MCP)
  description: >-
    The agent-facing commerce surface of L-Nutra's direct-to-consumer ProLon storefront. An anonymous
    MCP endpoint at https://prolonlife.com/api/ucp/mcp implements Universal Commerce Protocol
    2026-04-08 and returns thirteen tools (search_catalog, lookup_catalog, get_product, create/get/
    update/cancel_cart, create/get/update/cancel/complete_checkout, get_order) with full JSON Schema
    2020-12 input schemas. A second Shopify Storefront MCP endpoint at /api/mcp exposes five tools.
    Checkout completion requires contemporaneous human approval; the store's own robots.txt and
    llms.txt say so explicitly.
  humanURL: https://prolonlife.com/agents.md
  baseURL: https://prolonlife.com
